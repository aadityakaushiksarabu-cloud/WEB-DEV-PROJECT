<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="neon-bg"></div>
    <nav class="navig">
        <h2>Expense Tracker</h2>
        <a href="#" class="nav-link home" onclick="slideright()">Home</a>
        <a href="#" class="nav-link exp" onclick="slideleft()">Expenses</a>
    </nav>
    <div class="view">
        <div class="app" id="app">
            <div class="home" id="home">
                <div class="numbers">
                    <div class="card">
                        <span>Budget</span>
                        <strong id="total-budget">₹0</strong>
                        <span>Remaining Budget</span>
                        <strong id="remaining-budget">₹0</strong>
                        <input type="number" id="budget" placeholder="enter budget">
                        <button id="update-budget" onclick="updatebudget()">update budget</button>
                    </div>
                    <div class="cost-card">
                        <span>Expenditure</span>
                        <strong id="total-exp">₹0</strong>
                        <button  onclick="reset()">reset</button>
                    </div>
                </div>
                <div class="graps">
                    <div class="g1" id="g1">
                        <p>day wise</p>
                        <div class="day bar" id="Monday">M</div>
                        <div class="day bar" id="Tuesday">T</div>
                        <div class="day bar" id="Wenesday">W</div>
                        <div class="day bar" id="Thursday">T</div>
                        <div class="day bar" id="Fri">F</div>
                        <div class="day bar" id="Saturday">S</div>
                        <div class="day bar" id="Sunday">Su</div>
                    </div>
                    <div class="g2" id="g2">
                        <p>cat wise</p>
                        <div class="exp bar" id="food exp">food</div>
                        <div class="exp bar" id="travel exp">travel</div>
                        <div class="exp bar" id="cloths exp">cloths</div>
                        <div class="exp bar" id="tech exp">tech</div>
                        <div class="exp bar" id="other exp">other</div>
                    </div>
                </div>
            </div>
            <div id="exp">
                <h2>past expenses</h2>
                <div id="past-exp">
                    <p>no expenses yet</p>
                </div>
                <button onclick="showform()">add exp</button>
                <div id="exp-form">
                    <p>cost</p>
                    <input type="number" id="cost">
                    <br>
                    <p>catagory</p>
                    <select id="catagory">
                        <option value="food">food</option>
                        <option value="travel">travel</option>
                        <option value="cloths">cloths</option>
                        <option value="tech">tech</option>
                        <option value="other">other</option>
                    </select>
                    <br>
                    <p>date</p>
                    <input type="date" id="date">
                    <br>
                    <button id="add-exp" onclick="addexp()">add</button>
                </div>
            </div>
        </div>
    </div>
    <!--AI  outside-->
<script type="module">
    import { neonCursor } from "https://unpkg.com/threejs-toys@0.0.8/build/threejs-toys.module.cdn.min.js";

    neonCursor({
        el: document.body,
        shaderPoints: 16,
        curvePoints: 80,
        curveLerp: 0.5,
        radius1: 5,
        radius2: 3,
        velocityTreshold: 10,
        sleepRadiusX: 100,
        sleepRadiusY: 100,
        sleepTimeCoefX: 0.0025,
        sleepTimeCoefY: 0.0025,
    });

    </script>
      <!--AI  outside-->
</body>
</html>
